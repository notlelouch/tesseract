[project]
name = "tesseract"
version = "0.1.0"
description = "Tesseract v1: public market data recorder (Mudrex + Binance USD-M BTC perpetual)"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tesseract-record = "tesseract.recorder.app:main"
tesseract-parse = "tesseract.parser.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesseract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
